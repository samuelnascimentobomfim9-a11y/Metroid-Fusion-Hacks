name: "Issue Reopen Manager"

on:
  issue_comment:
    types: [created]

jobs:
  manage-reopen:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Reopen issue and comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commenter = context.payload.comment.user.login;

            if (commenter !== 'github-actions[bot]') {
              // 1. Reopens the issue
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'open'
              });

              // 2. Posts the custom reopening message
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: "Este issue foi automaticamente reaberto, uma vez que registou atividade recente."
              });
            }
